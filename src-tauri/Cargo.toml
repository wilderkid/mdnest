[package]
name = "mdnest"
version = "0.1.0"
description = "mdnest markdown editor"
authors = ["mdnest"]
edition = "2021"
rust-version = "1.77.2"
default-run = "mdnest"

[[bin]]
name = "kb-cli"
path = "src/bin/kb-cli.rs"
required-features = ["library"]

[[bin]]
name = "mdnest"
path = "src/main.rs"

[lib]
name = "mdnest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
dirs = "6"
http = "1"
base64 = "0.22"
url = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-openssl"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
# Workspace index ("library"): SQLite (bundled, FTS5) + sqlite-vec + file watching.
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
sqlite-vec = { version = "0.1", optional = true }
notify = { version = "8", default-features = false, features = ["macos_fsevent"], optional = true }

[features]
default = ["library"]
# The cross-check (no MSVC/macOS C toolchain on this box) runs without it; see scripts/cross-check.sh.
library = ["dep:rusqlite", "dep:sqlite-vec", "dep:notify"]

# Platform TLS everywhere (smaller than rustls+ring, ~1 MB on Linux): OpenSSL on Linux (libssl3 is a
# deb dependency and is also used by keyring's crypto-openssl), schannel on Windows,
# Security.framework on macOS. One reqwest version.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream"] }

[target.'cfg(target_os = "macos")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation", "NSView", "NSResponder", "NSWindow", "NSGraphics"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "objc2-app-kit"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
