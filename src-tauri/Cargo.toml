[package]
name = "mdnest"
version = "0.1.0"
description = "mdnest markdown editor"
authors = ["mdnest"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mdnest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
dirs = "6"
http = "1"
base64 = "0.22"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
